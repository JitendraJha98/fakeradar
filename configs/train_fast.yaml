# Training config for the FAST tier on a single GPU (A100: ~2-4h on a
# GenImage single-generator split; adjust batch size down for smaller GPUs).
# Manifests come from:
#   fakeradar prepare-genimage /data/GenImage --generators stable_diffusion_v_1_4 --test-generators all
# (val = 5% hold-out of the SD1.4 train split; GenImage's own val split is the
# *_test.csv used by `fakeradar benchmark` / `robustness`, never for selection.)
detector: configs/fast.yaml   # a detector YAML (CWD- or this-file-relative) or a preset: fast|accurate

data:
  train_manifest: data/manifests/genimage_stable_diffusion_v_1_4_train.csv
  val_manifest: data/manifests/genimage_stable_diffusion_v_1_4_val.csv
  num_workers: 8
  # GenImage stores real photos as JPEG and generated images as PNG, so
  # "has JPEG traces" becomes a shortcut for "real". This gives both
  # classes one JPEG pass at this quality (applies to training, validation and
  # the post-training calibration; use --equalize-jpeg 96 when benchmarking):
  equalize_jpeg_quality: 96          # as in the published runs; remove for non-GenImage data

optim:
  epochs: 10
  batch_size: 64
  lr: 2.0e-4
  weight_decay: 0.05
  warmup_steps: 500
  amp: true
  grad_clip: 1.0
  aux_loss_weight: 0.3

run:
  out_dir: runs/fast_v0
  device: auto      # auto (cuda if available, else cpu) | cuda | cuda:1 | cpu | mps
  seed: 42
  log_every: 50
  calibrate: true   # fit the output temperature on the val split after training
